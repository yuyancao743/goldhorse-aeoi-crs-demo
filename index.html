<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CRS data · 客户中心</title>
  <script src="iso-countries.js"></script>
  <style>
    :root {
      --nav-bg: #1b2433;
      --nav-bg-2: #151c28;
      --nav-hover: #243044;
      --nav-active: #2c3b52;
      --nav-text: #c9d2de;
      --nav-muted: #8b97a8;
      --accent: #3d7eff;
      --bar-dark: #5d6570;
      --bar-mid: #8a9199;
      --bar-light: #d9dde3;
      --line: #e6e8ec;
      --text: #1f2933;
      --muted: #6b7280;
      --bg: #f4f6f9;
      --white: #fff;
      --danger: #c0392b;
      --ok: #1a7f4b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; font-family: "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif; color: var(--text); background: var(--bg); }
    a { color: inherit; text-decoration: none; }
    button, input, select, textarea { font-family: inherit; }

    .app { display: flex; min-height: 100%; }

    /* ===== Sidebar (图一) ===== */
    .sidebar {
      width: 220px; flex-shrink: 0; background: var(--nav-bg); color: var(--nav-text);
      display: flex; flex-direction: column; user-select: none;
    }
    .brand {
      height: 56px; display: flex; align-items: center; gap: 10px; padding: 0 16px;
      background: var(--nav-bg-2); font-weight: 600; letter-spacing: .02em; font-size: 14px;
    }
    .brand .logo {
      width: 28px; height: 28px; border-radius: 6px; background: linear-gradient(135deg,#3d7eff,#6aa4ff);
      display: grid; place-items: center; color: #fff; font-size: 12px; font-weight: 700;
    }
    .nav { padding: 8px 0; overflow: auto; flex: 1; }
    .nav-item, .nav-sub {
      display: flex; align-items: center; gap: 10px; height: 42px; padding: 0 16px;
      cursor: pointer; font-size: 13.5px; color: var(--nav-text);
    }
    .nav-item:hover, .nav-sub:hover { background: var(--nav-hover); }
    .nav-item .chev { margin-left: auto; font-size: 10px; color: var(--nav-muted); }
    .nav-icon { width: 16px; height: 16px; flex-shrink: 0; opacity: .9; }
    .nav-sub { padding-left: 42px; height: 40px; font-size: 13px; position: relative; }
    .nav-sub .nav-icon { position: absolute; left: 18px; }
    .nav-sub.active { background: var(--nav-active); color: #fff; }
    .nav-group.open .nav-item { color: #fff; }

    /* ===== Main ===== */
    .main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
    .topbar {
      height: 56px; background: var(--white); border-bottom: 1px solid var(--line);
      display: flex; align-items: center; justify-content: space-between; padding: 0 24px;
    }
    .crumb { font-size: 13px; color: var(--muted); }
    .crumb b { color: var(--text); font-weight: 600; }
    .user-chip { font-size: 12px; color: var(--muted); }

    .content { padding: 18px 24px 40px; overflow: auto; flex: 1; }

    .panel { background: var(--white); border: 1px solid var(--line); border-radius: 6px; }
    .panel + .panel { margin-top: 14px; }

    .filter { padding: 16px 18px 8px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px 16px; }
    .field label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
    .field input, .field select, .field textarea {
      width: 100%; height: 34px; border: 1px solid #d0d5dd; border-radius: 4px;
      padding: 0 10px; font-size: 13px; background: #fff; color: var(--text);
    }
    .field textarea { height: 64px; padding: 8px 10px; resize: vertical; }
    .field input:focus, .field select:focus, .field textarea:focus {
      outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(61,126,255,.15);
    }

    .toolbar { padding: 8px 18px 16px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .toolbar-right { margin-left: auto; display: flex; gap: 8px; }
    .btn {
      height: 32px; padding: 0 14px; border: 1px solid #d0d5dd; background: #fff; border-radius: 4px;
      font-size: 13px; cursor: pointer; color: var(--text);
    }
    .btn:hover { border-color: #b8c0cc; background: #fafbfc; }
    .btn-primary { background: #2f6fed; color: #fff; border-color: #2f6fed; }
    .btn-primary:hover { background: #215ad4; }
    .btn-warn { background: #fff7ed; color: #9a3412; border-color: #fdba74; }
    .btn-ghost { background: transparent; }

    table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
    th, td { padding: 10px 12px; border-bottom: 1px solid var(--line); text-align: left; white-space: nowrap; }
    th { background: #f7f8fa; color: var(--muted); font-weight: 600; font-size: 12px; }
    tbody tr { cursor: pointer; }
    tbody tr:hover { background: #f6f8fc; }
    tbody tr.selected { background: #eef3ff; }
    .mono { font-family: "SF Mono", Menlo, Consolas, monospace; }
    .tag { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 11px; }
    .tag-ind { background: #e8f1ff; color: #1d4ed8; }
    .tag-ent { background: #f3e8ff; color: #7e22ce; }
    .tag-ok { background: #e8f8ef; color: var(--ok); }
    .link { color: #215ad4; cursor: pointer; }
    .icon-btn {
      display: inline-flex; align-items: center; justify-content: center;
      width: 28px; height: 28px; border: none; background: transparent;
      color: #215ad4; cursor: pointer; border-radius: 4px; padding: 0;
    }
    .icon-btn:hover { background: #e8f0fe; }
    .icon-btn svg { width: 16px; height: 16px; }
    .icon-btn.view { color: #4b5563; }
    .icon-btn.view:hover { background: #f3f4f6; }
    .ops { display: flex; gap: 2px; align-items: center; }
    .muted { color: var(--muted); }
    .addr-cell { white-space: pre-line; max-width: 280px; line-height: 1.35; }

    /* ===== Detail ===== */
    .detail-head {
      display: flex; align-items: center; gap: 10px; margin-bottom: 14px;
    }
    .tabs { display: flex; gap: 0; border-bottom: 1px solid var(--line); margin-bottom: 0; background: #fff; border-radius: 6px 6px 0 0; }
    .tab {
      height: 40px; padding: 0 18px; border: none; background: transparent; cursor: pointer;
      font-size: 13px; color: var(--muted); border-bottom: 2px solid transparent;
    }
    .tab.on { color: #215ad4; border-bottom-color: #215ad4; font-weight: 600; }

    .sec-bar {
      background: var(--bar-dark); color: #fff; font-size: 13px; font-weight: 700;
      padding: 7px 12px; letter-spacing: .02em;
    }
    .sec-bar.light { background: var(--bar-light); color: #1f2933; }
    .sec-bar.mid { background: #c5ccd4; color: #1f2933; }
    .sec-body { padding: 12px 14px 6px; background: #fff; }
    .kv-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px 24px; }
    .kv { font-size: 13px; line-height: 1.7; padding: 2px 0; }
    .kv .k { color: #4b5563; }
    .kv .v { color: #111; }
    .addr-pre { white-space: pre-line; display: inline; }

    .box { border: 1px solid #cfd5dd; margin: 0 0 12px; background: #fff; }
    .box .sec-body { padding: 10px 12px 4px; }
    .fg { display: grid; grid-template-columns: 280px 1fr; gap: 4px 12px; align-items: center; padding: 4px 0; font-size: 13px; }
    .fg > label { color: #374151; }
    .fg input, .fg select, .fg textarea {
      height: 30px; border: 1px solid #d8dee6; border-radius: 3px; padding: 0 8px; font-size: 13px; width: 100%;
    }
    .fg input[disabled], .fg select[disabled], .fg textarea[disabled] {
      background: #f7f8fa; color: #111; cursor: default; border-color: #e6e8ec;
      opacity: 1; -webkit-text-fill-color: #111;
    }
    .fg .hint { grid-column: 2; font-size: 11px; color: #9aa3af; margin-top: -2px; }
    .fg-pair .pair-controls, .fg-triple .triple-controls {
      display: grid; gap: 8px; align-items: center;
    }
    .fg-pair .pair-controls { grid-template-columns: minmax(140px, 1fr) auto minmax(150px, .75fr); }
    .fg-triple .triple-controls { grid-template-columns: minmax(120px, 1.1fr) auto minmax(110px, .7fr) auto minmax(130px, .8fr); }
    .pair-extra-label { color: #6b7280; font-size: 12px; white-space: nowrap; }
    .subhead { font-weight: 700; font-size: 13px; padding: 10px 0 2px; color: #1f2933; }
    .module-title {
      font-size: 14px; font-weight: 700; color: #1f2933;
      padding: 2px 2px 8px; letter-spacing: .01em;
    }
    .nested { margin: 8px 0 10px 0; border: 1px solid #d5dbe3; }
    .pay-row { display: grid; grid-template-columns: 360px 1fr; gap: 8px; align-items: center; padding: 4px 0; font-size: 13px; }

    .hint-bar {
      background: #f8fafc; border: 1px dashed #cbd5e1; color: #64748b; font-size: 12px;
      padding: 8px 12px; margin-bottom: 12px; border-radius: 4px;
    }

    /* ===== Modal ===== */
    .overlay {
      position: fixed; inset: 0; background: rgba(15,23,42,.45); display: none; align-items: center; justify-content: center; z-index: 50;
    }
    .overlay.show { display: flex; }
    .modal { width: min(920px, 92vw); max-height: 86vh; background: #fff; border-radius: 8px; display: flex; flex-direction: column; }
    .modal h3 { padding: 14px 18px; border-bottom: 1px solid var(--line); font-size: 15px; }
    .modal .body { padding: 14px 18px; overflow: auto; flex: 1; }
    .modal .foot { padding: 12px 18px; border-top: 1px solid var(--line); display: flex; justify-content: flex-end; gap: 8px; }
    pre.xml {
      background: #0f172a; color: #e2e8f0; padding: 14px; border-radius: 6px; font-size: 12px;
      overflow: auto; max-height: 52vh; line-height: 1.45;
    }
    .toast {
      position: fixed; top: 18px; right: 18px; background: #111827; color: #fff; padding: 10px 14px;
      border-radius: 6px; font-size: 13px; display: none; z-index: 80;
    }
    .pager {
      display: flex; align-items: center; justify-content: flex-end; gap: 8px;
      padding: 10px 14px; font-size: 12px; color: var(--muted); border-top: 1px solid var(--line);
    }
    .pager .btn { height: 28px; padding: 0 10px; font-size: 12px; }
    .pager .on { background: #2f6fed; color: #fff; border-color: #2f6fed; }
    .ccy-table { width: 100%; margin-top: 8px; }
    .ccy-table th { background: #eef0f3; color: #374151; }
    .ccy-table td, .ccy-table th { padding: 6px 10px; }
    .ccy-table tbody tr { cursor: default; }
    .ccy-table tbody tr:hover { background: transparent; }
    .pay-editor { border: 1px solid #d5dbe3; margin: 8px 0; }
    .pay-editor .sec-body { padding: 8px 10px; }
    .pay-ccy-row { display: grid; grid-template-columns: 90px 1fr 1fr 1fr 1fr; gap: 8px; align-items: end; padding: 6px 0; border-bottom: 1px solid #eef0f3; }
    .pay-ccy-row:last-child { border-bottom: none; }
    .pay-ccy-row label { display: block; font-size: 11px; color: #6b7280; margin-bottom: 4px; }
    .pay-ccy-row input, .pay-ccy-row select { height: 30px; width: 100%; border: 1px solid #d8dee6; border-radius: 3px; padding: 0 8px; font-size: 13px; }
    .bal-controls { display: grid; grid-template-columns: 110px 1fr; gap: 8px; align-items: center; }
    .import-name { font-size: 12px; color: var(--muted); align-self: center; }

    @media (max-width: 1200px) {
      .filter { grid-template-columns: repeat(2, 1fr); }
      .kv-grid { grid-template-columns: repeat(2, 1fr); }
      .fg { grid-template-columns: 200px 1fr; }
      .fg-pair .pair-controls, .fg-triple .triple-controls { grid-template-columns: 1fr; }
    }
  </style>
</head>

      if (!code) return "";

    }
    function countryCodeFromName(name) {
      if (!name) return "";
      const n = name.trim().toLowerCase();
      if (window.CODE_BY_NAME && CODE_BY_NAME[n]) return CODE_BY_NAME[n];
      const aliases = { china: "CN", "hong kong": "HK", "virgin islands, british": "VG", "british virgin islands": "VG" };
      return aliases[n] || "";
    }
    function titleFromTin(issuedByCode, tin) {
      if ((issuedByCode || "").toUpperCase() !== "CN" || !tin) return "";
      const d = parseInt(String(tin).replace(/\s/g, "").slice(-2, -1), 10);
      if (Number.isNaN(d)) return "";
      return d % 2 === 1 ? "Mr." : "Mrs.";
    }
    function splitName(full) {
      const parts = String(full || "").trim().split(/\s+/).filter(Boolean);
      if (!parts.length) return { first: "", middle: "", last: "" };
      if (parts.length === 1) return { first: parts[0].toUpperCase(), middle: "", last: "" };
      if (parts.length === 2) return { first: parts[0].toUpperCase(), middle: "", last: parts[1].toUpperCase() };
      return { first: parts[0].toUpperCase(), middle: parts.slice(1, -1).join(" "), last: parts[parts.length - 1].toUpperCase() };
    }
    function fmtDMY(iso, sep) {
      const m = String(iso || "").match(/(\d{4})-(\d{2})-(\d{2})/);
      if (!m) return iso || "";
      return m[3] + sep + m[2] + sep + m[1];
    }
    function fmtAmt(n) {
      const num = Number(n);
      if (!Number.isFinite(num)) return "0";
      const s = num.toFixed(2).replace(/\.?0+$/, "");
      return s === "-0" ? "0" : s;
    }
    function n2(n) {
      const raw = fmtAmt(n);
      const neg = raw.charAt(0) === "-";
      const body = neg ? raw.slice(1) : raw;
      const [intPart, dec] = body.split(".");
      const grouped = intPart.replace(/\B(?=(\d{3})+(?!\d))/g, ",");
      return (neg ? "-" : "") + grouped + (dec != null ? "." + dec : "");
    }

    function parseIndividualAddress(raw) {
      const L = lines(raw);
      const out = { street: "", district: "", city: "", country: "", countryCode: "", building: "", format: "Free" };
      if (!L.length) return out;
      const first = L[0];
      if (/中国|中國|CHINA/i.test(first) && first.length <= 8) {
        out.country = "China"; out.countryCode = "CN";
      } else {
        out.country = first; out.countryCode = countryCodeFromName(first);
      }
      if (L[1]) {
        const cityMap = [
          [/北京/, "BEIJING"], [/上海/, "SHANGHAI"], [/深圳/, "SHENZHEN"], [/广州|廣州/, "GUANGZHOU"],
          [/杭州/, "HANGZHOU"], [/成都/, "CHENGDU"], [/武汉|武漢/, "WUHAN"], [/重庆|重慶/, "CHONGQING"],
          [/贵阳|貴陽/, "GUIYANG"], [/太原/, "TAIYUAN"]
        ];
        for (const [re, en] of cityMap) { if (re.test(L[1])) { out.city = en; break; } }
        const dm = L[1].match(/([\u4e00-\u9fff]{1,8}[区區])$/);
        if (dm) out.district = dm[1];
        else {
          const dm2 = L[1].match(/([\u4e00-\u9fff]+[区區])/);
          if (dm2) out.district = dm2[1];
        }
      }
      if (L[2]) out.street = L[2];
      else if (L[1] && !out.street) out.street = L[1];
      out.format = out.city ? "Fixed" : "Free";
      return out;
    }

    function parseEntityAddress(raw) {
      const L = lines(raw);
      const out = { building: "", street: "", district: "", city: "", country: "", countryCode: "", format: "Free" };
      if (!L.length) return out;
      out.building = L[0] || "";
      if (L[1]) {
        const dist = L[1].match(/([^,]+)\s+District/i);
        if (dist) {
          out.district = dist[1].trim().replace(/,$/, "");
          out.street = L[1].replace(/,?\s*[^,]*District.*$/i, "").replace(/,$/, "").trim();
        } else {
          out.street = L[1];
        }
      }
      const last = L[L.length - 1] || "";
      const cityCountry = last.match(/^([A-Za-z\s]+?)\s+(China|Hong Kong|Singapore|Seychelles)$/i);
      if (cityCountry) {
        out.city = cityCountry[1].trim().toUpperCase();
        out.country = countryName(countryCodeFromName(cityCountry[2])) || (cityCountry[2][0].toUpperCase() + cityCountry[2].slice(1).toLowerCase());
        out.countryCode = countryCodeFromName(cityCountry[2]) || countryCodeFromName(out.country);
      } else if (/china|hong kong|british virgin|singapore/i.test(last) && !/[0-9]/.test(last)) {
        if (/china/i.test(last) && /beijing/i.test(last)) { out.city = "BEIJING"; out.country = "China"; out.countryCode = "CN"; }
        else if (/british virgin/i.test(last)) { out.country = "Virgin Islands, British"; out.countryCode = "VG"; }
        else if (/hong kong|, hk$/i.test(last)) { out.country = "Hong Kong"; out.countryCode = "HK"; }
        else if (/china/i.test(last)) { out.country = "China"; out.countryCode = "CN"; }
      } else if (L.length >= 3) {
        const mid = last.replace(/,?\s*(China|Hong Kong|HK)$/i, "").trim();
        if (/beijing/i.test(mid)) out.city = "BEIJING";
        else if (/hong kong|kennedy town/i.test(last)) { out.city = ""; out.country = "Hong Kong"; out.countryCode = "HK"; }
        if (/china/i.test(last)) { out.country = "China"; out.countryCode = "CN"; }
        if (/hong kong|, hk$/i.test(last)) { out.country = "Hong Kong"; out.countryCode = "HK"; }
      }
      out.format = out.city ? "Fixed" : "Free";
      return out;
    }

    function parseCPAddress(raw) {

      });
      const total = pageCount();
      const pages = [];
      for (let i = 1; i <= total; i++) pages.push(i);
      document.getElementById("pager").innerHTML = filtered.length ? `
        <span>共 ${filtered.length} 条</span>
        <button class="btn" ${page <= 1 ? "disabled" : ""} onclick="goPage(${page - 1})">上一页</button>
        ${pages.map(i => `<button class="btn ${i === page ? "on" : ""}" onclick="goPage(${i})">${i}</button>`).join("")}
        <button class="btn" ${page >= total ? "disabled" : ""} onclick="goPage(${page + 1})">下一页</button>
      ` : "";
    }
    function toggleOne(id, on) {
      on ? selected.add(id) : selected.delete(id);

    function rec(id) { return DATA.find(x => x.id === id); }

    function backList() {
      document.getElementById("view-detail").style.display = "none";

    function switchTab(name) {
      document.querySelectorAll(".tab").forEach(t => t.classList.toggle("on", t.dataset.tab === name));
      document.getElementById("tab-main").style.display = name === "main" ? "block" : "none";
      document.getElementById("tab-detail").style.display = name === "detail" ? "block" : "none";
    }

    function kv(k, v, extra) {
      return `<div class="kv"><span class="k">${k} : </span><span class="v ${extra || ""}">${v == null || v === "" ? "" : v}</span></div>`;
    }

    function openDetail(id, mode) {
      currentId = id;
      detailMode = mode === "edit" ? "edit" : "view";
      const r = rec(id);
      document.getElementById("view-list").style.display = "none";
      document.getElementById("view-detail").style.display = "block";
      document.getElementById("detail-title").textContent = r.clientAccount + " · " + r.crsType;
      document.getElementById("detail-sub").textContent = "Return Year " + r.year + (detailMode === "view" ? " · 查看" : " · 编辑");
      document.getElementById("btn-save").style.display = detailMode === "edit" ? "" : "none";
      document.getElementById("tab-btn-detail").textContent = detailMode === "edit" ? "详细信息（可编辑）" : "详细信息";
      document.getElementById("detail-hint").textContent = detailMode === "edit"
        ? "可修改详细信息中的映射字段后保存。主信息为源数据快照。有 City 时 Address Format 默认为 Fixed，否则为 Free。"
        : "当前为查看模式，字段只读，不可编辑。请使用列表中的编辑图标进入编辑。";

      renderMain(r);
      renderDetailForm(r);
    }

    function inp(name, value, placeholder, locked) {

    function sel(name, value, options) {

        return `<option value="${esc(v)}" ${v === value ? "selected" : ""}>${esc(l)}</option>`;

    function bindMoneyInputs() {
      const el = document.querySelector(`[data-f="balanceAmt"]`);
      if (!el) return;
      el.addEventListener("input", () => {
        let amt = el.value.replace(/[^\d.]/g, "");
        const dot = amt.indexOf(".");
        if (dot >= 0) amt = amt.slice(0, dot + 1) + amt.slice(dot + 1).replace(/\./g, "").slice(0, 2);
        el.value = amt;
      });
      el.addEventListener("blur", () => {
        const t = String(el.value || "").trim();
        if (isAmtToken(t)) el.value = stripAmtZeros(t);
      });
    }

    function collectForm() {
      const root = document.getElementById("tab-detail");
      const r = rec(currentId);
      const m = r.mapped;
      const payMap = {};
      root.querySelectorAll("[data-f]").forEach(el => {
        const path = el.getAttribute("data-f");
        const val = el.value;
        if (path.startsWith("cps.")) {
          const [, idx, key] = path.split(".");
          if (m.cps[idx]) {
            m.cps[idx][key] = val;
            if (key === "cpTypeCode") m.cps[idx].cpTypeLabel = CP_TYPE_LABEL[val] || val;
            if (key === "firstName" || key === "lastName") m.cps[idx][key] = String(val || "").toUpperCase();
          }
        } else if (path.startsWith("pays.")) {
          const [, idx, key] = path.split(".");
          if (!payMap[idx]) payMap[idx] = {};
          payMap[idx][key] = val;
        } else if (path === "accountNumber") {
          /* 交易账号只读，不覆盖 */
        } else {
          m[path] = val;
          if (path === "entityHolderType") m.entityHolderTypeLabel = AH_TYPE_LABEL[val] || "";
          if (path === "firstName" || path === "lastName") m[path] = String(val || "").toUpperCase();
        }
      });
      const idxs = Object.keys(payMap).sort((a, b) => Number(a) - Number(b));
      if (idxs.length) {
        m.payments = idxs.map(i => {
          const p = payMap[i];
          const ccy = (p.ccy || "HKD").toUpperCase();
          const n501 = Number(String(p.crs501 || "0").replace(/,/g, ""));
          const n502 = Number(String(p.crs502 || "0").replace(/,/g, ""));
          const n503 = Number(String(p.crs503 || "0").replace(/,/g, ""));
          const n504 = Number(String(p.crs504 || "0").replace(/,/g, ""));
          return {
            ccy,
            crs501: n501, crs502: n502, crs503: n503, crs504: n504,
            dividends: money(ccy, n501),
            interest: money(ccy, n502),
            proceeds: money(ccy, n503),
            otherIncome: money(ccy, n504)
          };
        });
      }
    }

    function saveDetail() {
      if (detailMode !== "edit") return;
      collectForm();
      const r = rec(currentId);
      const m = r.mapped;
      const ccy = String(m.balanceCcy || "HKD").toUpperCase();
      const amt = String(m.balanceAmt || "0").replace(/,/g, "").trim();
      if (!isAmtToken(amt)) {
        toast("Account Balance 金额须为整数、1 位或 2 位小数");
        return;
      }
      m.balanceCcy = ccy;
      m.balanceAmt = stripAmtZeros(amt);
      m.accountBalance = money(ccy, m.balanceAmt);
      r.ccy = ccy;
      r.portfolio = Number(m.balanceAmt);
      for (const p of m.payments || []) {
        for (const k of ["crs501", "crs502", "crs503", "crs504"]) {
          if (!Number.isFinite(Number(p[k]))) {
            toast("付款金额须为数字");
            return;
          }
        }
      }
      r.payments = (m.payments || []).map(p => ({
        ccy: p.ccy, crs501: p.crs501, crs502: p.crs502, crs503: p.crs503, crs504: p.crs504
      }));
      if (r.payments[0]) {
        r.crs501 = r.payments[0].crs501;
        r.crs502 = r.payments[0].crs502;
        r.crs503 = r.payments[0].crs503;
        r.crs504 = r.payments[0].crs504;
      }
      r.mappedTouched = true;
      renderMain(r);
      renderDetailForm(r);
      toast("已保存，可用于生成 XML");
    }

    function pad2(n) { return String(n).padStart(2, "0"); }
    function tsStamp(d) {
      return d.getFullYear() + pad2(d.getMonth() + 1) + pad2(d.getDate()) + pad2(d.getHours()) + pad2(d.getMinutes()) + pad2(d.getSeconds());
    }
    function isoTs(d) {
      const off = -d.getTimezoneOffset();
      const sign = off >= 0 ? "+" : "-";
      const hh = pad2(Math.floor(Math.abs(off) / 60));
      const mm = pad2(Math.abs(off) % 60);
      return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}T${pad2(d.getHours())}:${pad2(d.getMinutes())}:${pad2(d.getSeconds())}${sign}${hh}:${mm}`;
    }
    function parseMoney(s) {
      const res = normalizeMoneyValue(s);
      if (res.ok) {
        const m = res.value.match(/^([A-Z]{3})\s+(.+)$/);
        return { ccy: m[1], amt: m[2] };
      }
      const fallback = String(s || "").trim().match(/^([A-Z]{3})\s+(.+)$/);
      if (!fallback) return { ccy: "HKD", amt: "0" };
      return { ccy: fallback[1], amt: fallback[2].replace(/,/g, "") };
    }
    function legalTypeCode(label) {
      const map = { Residential: "OECD302", Business: "OECD303", "Residential or Business": "OECD301", "Registered Office": "OECD304", Unspecified: "OECD305" };
      return map[label] || "OECD302";
    }
    function nameTypeCode(label) {
      if (/legal/i.test(label)) return "OECD207";
      return "OECD202";
    }
    function countryCodeOf(nameOrCode) {
      if (!nameOrCode) return "";
      const u = nameOrCode.toUpperCase();
      if (u.length === 2 && ISO_COUNTRIES[u]) return u;
      return countryCodeFromName(nameOrCode) || "";
    }

    function xmlAddress(m, indent) {
      const sp = " ".repeat(indent);
      const cc = countryCodeOf(m.countryCode || m.country);
      let x = `${sp}<Address legalAddressType="${legalTypeCode(m.legalAddressType)}">\n`;
      x += `${sp}  <CountryCode>${esc(cc)}</CountryCode>\n`;
      if (m.addressFormat === "Free" && !m.city) {
        const free = [m.building, m.street, [m.district, m.city].filter(Boolean).join(" "), m.country].filter(Boolean);
        x += `${sp}  <AddressFree>\n`;
        (free.length ? free : [""]).slice(0, 5).forEach(line => { x += `${sp}    <Line>${esc(line)}</Line>\n`; });
        x += `${sp}  </AddressFree>\n`;
      } else {
        x += `${sp}  <AddressFix>\n`;
        if (m.street) x += `${sp}    <Street>${esc(m.street)}</Street>\n`;
        if (m.building) x += `${sp}    <BuildingIdentifier>${esc(m.building)}</BuildingIdentifier>\n`;
        if (m.suite) x += `${sp}    <SuiteIdentifier>${esc(m.suite)}</SuiteIdentifier>\n`;
        if (m.floor) x += `${sp}    <FloorIdentifier>${esc(m.floor)}</FloorIdentifier>\n`;
        if (m.district) x += `${sp}    <DistrictName>${esc(m.district)}</DistrictName>\n`;
        x += `${sp}    <City>${esc(m.city || "")}</City>\n`;
        if (m.countrySubentity) x += `${sp}    <CountrySubentity>${esc(m.countrySubentity)}</CountrySubentity>\n`;
        if (m.postalCode) x += `${sp}    <PostCode>${esc(m.postalCode)}</PostCode>\n`;
        if (m.poBox) x += `${sp}    <POB>${esc(m.poBox)}</POB>\n`;
        x += `${sp}  </AddressFix>\n`;
      }
      x += `${sp}</Address>\n`;
      return x;
    }

    function xmlPerson(m, indent, isOrg) {
      const sp = " ".repeat(indent);
      let x = "";
      const res = countryCodeOf(m.residenceCountryCode || m.residenceCountry);
      x += `${sp}<ResCountryCode>${esc(res)}</ResCountryCode>\n`;
      if (!isOrg && m.tin) {
        const ib = countryCodeOf(m.issuedByCode || m.issuedBy);
        x += `${sp}<TIN${ib ? ` issuedBy="${esc(ib)}"` : ""}>${esc(m.tin)}</TIN>\n`;
      }
      if (isOrg && m.entityIN) {
        const ib = countryCodeOf(m.inIssuedByCode || m.inIssuedBy);
        x += `${sp}<IN${ib ? ` issuedBy="${esc(ib)}"` : ""}${m.inType ? ` INType="${esc(m.inType)}"` : ""}>${esc(m.entityIN)}</IN>\n`;
      }
      if (isOrg) {
        x += `${sp}<Name nameType="${nameTypeCode(m.nameType)}">${esc(m.orgName)}</Name>\n`;
      } else {
        x += `${sp}<Name nameType="${nameTypeCode(m.nameType)}">\n`;
        if (m.precedingTitle) x += `${sp}  <PrecedingTitle>${esc(m.precedingTitle)}</PrecedingTitle>\n`;
        if (m.title) x += `${sp}  <Title>${esc(m.title)}</Title>\n`;
        x += `${sp}  <FirstName>${esc(m.firstName)}</FirstName>\n`;
        if (m.middleName) x += `${sp}  <MiddleName>${esc(m.middleName)}</MiddleName>\n`;
        if (m.namePrefix) x += `${sp}  <NamePrefix>${esc(m.namePrefix)}</NamePrefix>\n`;
        x += `${sp}  <LastName>${esc(m.lastName)}</LastName>\n`;
        if (m.generation) x += `${sp}  <GenerationIdentifier>${esc(m.generation)}</GenerationIdentifier>\n`;
        if (m.suffix) x += `${sp}  <Suffix>${esc(m.suffix)}</Suffix>\n`;
        if (m.generalSuffix) x += `${sp}  <GeneralSuffix>${esc(m.generalSuffix)}</GeneralSuffix>\n`;
        x += `${sp}</Name>\n`;
      }
      x += xmlAddress(m, indent);
      if (!isOrg && (m.birthDateIso || m.birthDate)) {
        const iso = m.birthDateIso || (function () {
          const p = String(m.birthDate).match(/(\d{2})[/-](\d{2})[/-](\d{4})/);
          return p ? `${p[3]}-${p[2]}-${p[1]}` : "";
        })();
        x += `${sp}<BirthInfo>\n`;
        if (iso) x += `${sp}  <BirthDate>${esc(iso)}</BirthDate>\n`;
        if (m.birthCity) x += `${sp}  <City>${esc(m.birthCity)}</City>\n`;
        if (m.birthCitySub) x += `${sp}  <CitySubentity>${esc(m.birthCitySub)}</CitySubentity>\n`;
        const bcc = countryCodeOf(m.birthCountryCode || m.birthCountry);
        if (bcc) {
          x += `${sp}  <CountryInfo>\n${sp}    <CountryCode>${esc(bcc)}</CountryCode>\n${sp}  </CountryInfo>\n`;
        }
        x += `${sp}</BirthInfo>\n`;
      }
      return x;
    }

    function xmlAccountReport(r, opts) {
      const m = r.mapped;
      const docType = opts.docTypeIndic;
      const docRef = m.docRefId || (FI.aeoiId + "-" + r.year + "-" + r.clientAccount);
      let x = `      <AccountReport>\n`;
      x += `        <DocSpec>\n`;
      x += `          <DocTypeIndic>${docType}</DocTypeIndic>\n`;
      x += `          <DocRefId>${esc(docRef)}</DocRefId>\n`;
      if (opts.messageType === "CRS702") {
        x += `          <CorrFileSerialNumber>${esc(opts.corrFileSn)}</CorrFileSerialNumber>\n`;
        x += `          <CorrDocRefId>${esc(opts.corrDocRefId || docRef)}</CorrDocRefId>\n`;
        x += `          <CorrAccountNumber>${esc(r.clientAccount)}</CorrAccountNumber>\n`;
      }
      x += `        </DocSpec>\n`;
      const closed = /closed/i.test(m.accountStatus);
      const dormant = /dormant/i.test(m.accountStatus);
      x += `        <AccountNumber AcctNumberType="OECD604" UndocumentedAccount="${m.undocumented === "Yes" ? "true" : "false"}"${closed ? ' ClosedAccount="true"' : ""}${dormant ? ' DormantAccount="true"' : ""}>${esc(r.clientAccount)}</AccountNumber>\n`;
      x += `        <AccountHolder>\n`;
      if (r.crsType === "Individual") {
        x += `          <Individual>\n${xmlPerson(m, 12, false)}          </Individual>\n`;
      } else {
        x += `          <Organisation>\n${xmlPerson(m, 12, true)}          </Organisation>\n`;
        x += `          <AcctHolderType>${esc(m.entityHolderType || r.accHolderType)}</AcctHolderType>\n`;
      }
      x += `        </AccountHolder>\n`;
      if (r.crsType === "Entity" && m.cps && m.cps.length) {
        m.cps.forEach(cp => {
          x += `        <ControllingPerson>\n`;
          x += `          <Individual>\n${xmlPerson(cp, 12, false)}          </Individual>\n`;
          x += `          <CtrlgPersonType>${esc(cp.cpTypeCode || "CRS801")}</CtrlgPersonType>\n`;
          x += `        </ControllingPerson>\n`;
        });
      }
      const balCcy = m.balanceCcy || parseMoney(m.accountBalance).ccy;
      const balAmt = m.balanceAmt != null && m.balanceAmt !== "" ? stripAmtZeros(String(m.balanceAmt).replace(/,/g, "")) : parseMoney(m.accountBalance).amt;
      x += `        <AccountBalance currCode="${esc(balCcy)}">${esc(balAmt)}</AccountBalance>\n`;
      const pays = paymentRows(r);
      pays.forEach(p => {
        [
          ["CRS501", p.crs501],
          ["CRS502", p.crs502],
          ["CRS503", p.crs503],
          ["CRS504", p.crs504]
        ].forEach(([t, amt]) => {
          x += `        <Payment>\n          <Type>${t}</Type>\n          <PaymentAmnt currCode="${esc(p.ccy)}">${esc(fmtAmt(amt))}</PaymentAmnt>\n        </Payment>\n`;
        });
      });
      x += `      </AccountReport>\n`;
      return x;
    }

    function buildXml(records, messageType, extra) {
      const now = new Date();
      const year = (records[0] && records[0].year) || document.getElementById("q-year").value || "2025";
      const seq = "00";
      const ref = year + FI.aeoiId + tsStamp(now) + seq;
      extra = extra || {};
      let body = `<?xml version="1.0" encoding="UTF-8"?>\n`;
      body += `<AEOI_Report version="2.0" xmlns="http://www.ird.gov.hk/AEOI/crs/v2" xmlns:cfc="http://www.ird.gov.hk/AEOI/aeoitypes/v2" xmlns:iso="urn:oecd:ties:isocrstypes:v1">\n`;
      body += `  <MessageSpec>\n`;
      body += `    <AeoiId>${esc(FI.aeoiId)}</AeoiId>\n`;
      body += `    <FIName>${esc(FI.fiName)}</FIName>\n`;
      body += `    <MessageRefId>${esc(ref)}</MessageRefId>\n`;
      body += `    <MessageTypeIndic>${messageType}</MessageTypeIndic>\n`;
      body += `    <ReturnYear>${esc(year)}</ReturnYear>\n`;
      body += `    <Timestamp>${isoTs(now)}</Timestamp>\n`;
      body += `  </MessageSpec>\n`;
      body += `  <CrsBody>\n    <ReportingGroup>\n`;
      records.forEach(r => { body += xmlAccountReport(r, { messageType, ...extra }); });
      body += `    </ReportingGroup>\n  </CrsBody>\n</AEOI_Report>\n`;
      return { name: ref + ".xml", body };
    }

    function showXml(title, pack) {
      lastXml = pack;
      document.getElementById("modal-title").textContent = title;
      document.getElementById("modal-body").innerHTML = `<pre class="xml">${esc(pack.body)}</pre>`;
      document.getElementById("overlay").classList.add("show");
    }
    function closeModal() { document.getElementById("overlay").classList.remove("show"); }
    function downloadXml() {
      const blob = new Blob([lastXml.body], { type: "application/xml;charset=utf-8" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = lastXml.name;
      a.click();
      URL.revokeObjectURL(a.href);
      toast("已下载 " + lastXml.name);
    }

    function filingEnvField() {
      return `<div class="field" style="margin-bottom:10px"><label>报送环境</label>
        <select id="f-env">
          <option value="prod" selected>正式</option>
          <option value="test">IRD 测试</option>
        </select></div>
        <div class="hint-bar">同一文件不能混正式码和测试码。OECD11 / OECD12 / OECD13 只用于香港税务局门户测试 / prior consent，不能当正式 File Return。</div>`;
    }
    function sync702DocTypes() {
      const test = document.getElementById("f-env").value === "test";
      document.getElementById("f-doctype").innerHTML = test
        ? `<option value="OECD12">OECD12 测试更正 Corrected Test Data</option>
           <option value="OECD13">OECD13 测试删除 Deletion of Test Data</option>`
        : `<option value="OECD2">OECD2 更正 Corrected Data</option>
           <option value="OECD3">OECD3 删除 Deletion of Data</option>`;
    }

    function openCrs701() {
      const year = document.getElementById("q-year").value;
      const recs = DATA.filter(r => r.year === year);
      if (!recs.length) return toast("该申报年份没有数据");
      document.getElementById("modal-title").textContent = "生成 CRS701 新报 XML · Return Year " + year;
      document.getElementById("modal-body").innerHTML = `
        ${filingEnvField()}
        <div class="field" style="margin-bottom:10px"><label>将生成账户</label>
          <div class="muted">${recs.length} 条 · ${recs.map(r => r.clientAccount).join("、")}</div></div>
        <div class="toolbar" style="padding-left:0"><button class="btn btn-primary" type="button" id="btn-mk701">生成 XML</button></div>
        <div id="crs701-preview"></div>`;
      document.getElementById("overlay").classList.add("show");
      document.getElementById("btn-mk701").onclick = () => {
        const test = document.getElementById("f-env").value === "test";
        const pack = buildXml(recs, "CRS701", { docTypeIndic: test ? "OECD11" : "OECD1" });
        lastXml = pack;
        bumpGenCount(recs, "crs701Count");
        document.getElementById("crs701-preview").innerHTML = `<pre class="xml">${esc(pack.body)}</pre>`;
      };
    }

    function openCrs702(singleId) {
      const ids = singleId ? [singleId] : [...selected];
      if (!ids.length) return toast("请先勾选需要更正/删除的记录");
      const recs = ids.map(rec).filter(Boolean);
      document.getElementById("modal-title").textContent = "生成 CRS702 更正/删除 XML";
      document.getElementById("modal-body").innerHTML = `
        <div class="field" style="margin-bottom:10px"><label>已选账户</label>
          <div class="muted">${recs.map(r => r.clientAccount).join("、")}</div></div>
        ${filingEnvField()}
        <div class="field" style="margin-bottom:10px"><label>DocTypeIndic</label>
          <select id="f-doctype"></select></div>
        <div class="field" style="margin-bottom:10px"><label>CorrFileSerialNumber（门户回执 8 位文件序号）</label>
          <input id="f-sn" maxlength="8" placeholder="例如 00000012" /></div>
        <div class="field"><label>CorrDocRefId（可空，默认用原 DocRefId）</label>
          <input id="f-corr" placeholder="可选" /></div>
        <div class="toolbar" style="padding-left:0"><button class="btn btn-primary" type="button" id="btn-mk702">生成 XML</button></div>
        <div id="crs702-preview"></div>`;
      document.getElementById("overlay").classList.add("show");
      sync702DocTypes();
      document.getElementById("f-env").onchange = sync702DocTypes;
      document.getElementById("btn-mk702").onclick = () => {
        const sn = document.getElementById("f-sn").value.trim();
        if (!/^\d{8}$/.test(sn)) return toast("CorrFileSerialNumber 须为 8 位数字");
        const pack = buildXml(recs, "CRS702", {
          docTypeIndic: document.getElementById("f-doctype").value,
          corrFileSn: sn,
          corrDocRefId: document.getElementById("f-corr").value.trim()
        });
        lastXml = pack;
        bumpGenCount(recs, "crs702Count");
        document.getElementById("crs702-preview").innerHTML = `<pre class="xml">${esc(pack.body)}</pre>`;
      };
    }

    function bumpGenCount(recs, key) {
      recs.forEach(r => { r[key] = (r[key] || 0) + 1; });
      renderList();
    }

    function importPdf(input) {
      const file = input.files && input.files[0];
      input.value = "";
      if (!file) return;
      if (!/\.pdf$/i.test(file.name)) return toast("仅支持 PDF 格式");
      document.getElementById("import-name").textContent = "已选择：" + file.name;
      const incoming = demoIncomingFromFile(file);
      if (!incoming.length) return toast("导表错误：文件没有账户数据", 3500);
      const years = [...new Set(incoming.map(r => String(r.year || "").trim()).filter(Boolean))];
      const hasBlankYear = incoming.some(r => !String(r.year || "").trim());
      if (hasBlankYear || years.length !== 1) {
        return toast("导表错误：同一文件只能包含一个申报年份", 3500);
      }
      const year = years[0];
      const oldByAcct = new Map();
      DATA.filter(r => r.year === year).forEach(r => oldByAcct.set(r.clientAccount, r));
      let kept = 0;
      const nextYearRows = incoming.map(item => {
        const old = oldByAcct.get(item.clientAccount);
        if (old && old.mappedTouched) {
          kept += 1;
          return {
            ...item,
            id: old.id,
            crs701Count: old.crs701Count || 0,
            crs702Count: old.crs702Count || 0,
            mapped: old.mapped,
            mappedTouched: true
          };
        }
        return {
          ...item,
          crs701Count: old ? (old.crs701Count || 0) : 0,
          crs702Count: old ? (old.crs702Count || 0) : 0,
          mapped: deriveMapped(item),
          mappedTouched: false
        };
      });
      DATA = DATA.filter(r => r.year !== year).concat(nextYearRows);
      sortData();
      initYearSelect();
      document.getElementById("q-year").value = year;
      document.getElementById("q-acct").value = "";
      search();
      const msg = kept
        ? "已按 " + year + " 全量替换 " + nextYearRows.length + " 条，其中 " + kept + " 条仅更新主信息（详细信息已编辑，已保留）"
        : "已按 " + year + " 全量替换 " + nextYearRows.length + " 条，并重新生成详细信息";
      toast(msg, 4000);
    }
    function isMultiYearFileName(name) {
      return /多年|multi[-_]?year|multiyear|20\d{2}\s*[-_~到至\/]\s*20\d{2}/i.test(name || "");
    }
    function demoIncomingFromFile(file) {
      if (isMultiYearFileName(file.name)) {
        const a = JSON.parse(JSON.stringify(RAW[0]));
        const b = JSON.parse(JSON.stringify(RAW[1] || RAW[0]));
        a.year = "2024";
        b.year = "2025";
        b.id = String(b.id) + "-y2";
        return [a, b];
      }
      return JSON.parse(JSON.stringify(RAW));
    }

    function toast(msg, ms) {
      const t = document.getElementById("toast");
      t.textContent = msg; t.style.display = "block";
      setTimeout(() => t.style.display = "none", ms || 2200);
    }

    initYearSelect();
    search();
  </script>
</body>
</html>
